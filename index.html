<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parsa Isken Store | دانلود اسکین ماینکرافت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 Parsa Isken Store</h1>
    <p>دانلود اسکین ماینکرافت</p>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="جستجوی اسکین...">
      <select id="category">
        <option value="all">همه دستهها</option>
      </select>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>اسکینی پیدا نشد 😕</p>
  </main>

  <footer>
    <p>ساخته شده با ❤️ برای کانال Parsa Isken Store</p>
    <a href="https://t.me/" target="_blank">کانال تلگرام</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
